services:
  db:
    image: pgvector/pgvector:pg16
    container_name: compass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compass}
      POSTGRES_DB: ${POSTGRES_DB:-compass}
    ports:
      - "5432:5432"
    volumes:
      - compass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compass} -d ${POSTGRES_DB:-compass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compass-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-compass}:${POSTGRES_PASSWORD:-compass}@db:5432/${POSTGRES_DB:-compass}
      SEED_ON_START: "true"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - compass_model_cache:/app/.fastembed_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  compass_pgdata:
  compass_model_cache:
