name: Manual LLM & Retrieval Evals

on:
  workflow_dispatch:
    inputs:
      skip_llm:
        description: "Skip LLM-as-judge generation evals (retrieval only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Compass evaluation harness
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.skip_llm }}" = "true" ]; then
            python -m evals.run --skip-llm
          else
            python -m evals.run
          fi

      - name: Upload evals/results.md artifact
        uses: actions/upload-artifact@v4
        with:
          name: compass-eval-results
          path: evals/results.md
